# Walt worker en Fly.io, región São Paulo (gru, la única de Sudamérica). Sintaxis verificada en
# https://docs.fly.io/reference/configuration (consultada el 2026-10-20).
#
# Primera vez (cuenta de Salva):
#   fly apps create walt-worker
#   fly secrets set --app walt-worker TELEGRAM_BOT_TOKEN=… TELEGRAM_BOT_USERNAME=… TELEGRAM_WEBHOOK_SECRET=… \
#     SUPABASE_URL=… SUPABASE_SERVICE_ROLE_KEY=… ANTHROPIC_API_KEY=… GITHUB_TOKEN=… \
#     GITHUB_APP_ID=… GITHUB_APP_PRIVATE_KEY=… OPENAI_API_KEY=… PANEL_URL=… DEMO_SITE_URL=…
#   fly deploy
# Rollback: fly releases --app walt-worker y fly deploy --image <imagen de la versión anterior>.
# Antes del primer deploy: aplicar 0004 (WORKER_QUEUE=durable la exige) y apagar el worker de la compu
# (dos bots con el mismo token se pisan).

app = "walt-worker"
primary_region = "gru"
# El worker deja de tomar trabajos con SIGTERM y espera los que corren; un agente de código tarda hasta
# 5,5 min, así que se le da el máximo que permite Fly (300 s). Lo que no termina vuelve a la cola cuando
# vence su lease y lo toma la máquina nueva.
kill_signal = "SIGTERM"
kill_timeout = 300

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Blue-green: la máquina nueva tiene que pasar los health checks antes de recibir tráfico y recién
  # entonces se apaga la vieja. Sin cortes aunque haya una sola máquina (las dos comparten la cola en
  # Postgres, con un trabajo a la vez por proyecto).
  strategy = "bluegreen"
  wait_timeout = "10m"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  LOG_FORMAT = "json"
  TELEGRAM_MODE = "webhook"
  PUBLIC_WORKER_URL = "https://walt-worker.fly.dev"
  WORKER_QUEUE = "durable"
  GITHUB_MODE = "real"
  LLM_PROVIDER = "anthropic"
  SCREENSHOTS = "on"

[http_service]
  internal_port = 8080
  force_https = true
  # Siempre prendida: recibe el webhook de Telegram y procesa la cola.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 200

  # Readiness: base alcanzable, cola corriendo y Telegram conectado. 503 al cerrar.
  [[http_service.checks]]
    grace_period = "40s"
    interval = "15s"
    method = "GET"
    path = "/readyz"
    timeout = "5s"

# Liveness, independiente del ruteo: el proceso y su event loop responden.
[checks.vivo]
  type = "http"
  port = 8080
  path = "/healthz"
  method = "get"
  grace_period = "40s"
  interval = "30s"
  timeout = "5s"

[metrics]
  port = 8080
  path = "/metrics"

[[restart]]
  policy = "always"

[[vm]]
  # Chromium y el agente de código: 2 GB. shared-cpu-2x de 2 GB cuesta USD 13,39/mes en las regiones más
  # baratas (https://docs.fly.io/about/pricing, consultada el 2026-10-20; São Paulo puede costar más).
  size = "shared-cpu-2x"
  memory = "2gb"
